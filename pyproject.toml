[project]
name = "cotterbot"
version = "0.1.0"
description = "Compliance-testing framework for AI-controlled robot policies — pytest for robot policies."
authors = [{ name = "yihan", email = "hyihan2007hong@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gymnasium[mujoco] (>=1.0,<2.0)",
    "mujoco (>=3.2,<4.0)",
    "stable-baselines3 (>=2.4,<3.0)",
    "torch (>=2.4,<3.0)",
    "numpy (>=1.26,<2.0)",
    "scipy (>=1.13,<2.0)",
    "pyyaml (>=6.0,<7.0)",
    "gymnasium-robotics (>=1.3,<2.0)",
]

[project.scripts]
cotter = "cotter.cli:main"

[tool.poetry]
packages = [{ include = "cotter" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
